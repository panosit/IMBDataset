[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "imdb-sentiment-research"
version = "0.1.0"
description = "Leakage-safe, reproducible sentiment-analysis experiments"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3", "scikit-learn>=1.3,<2", "joblib>=1.3,<2", "numpy>=1.24,<3"]

[project.optional-dependencies]
transformers = ["torch>=2.1", "transformers>=4.35", "datasets>=2.14", "accelerate>=0.24"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
